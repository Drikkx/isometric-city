# Render Blueprint — IsoCity (Next.js 16)
#
# Deploy: Render Dashboard -> New -> Blueprint -> select this repo.
# Or:     render blueprint launch (Render CLI)
#
# Notes:
# - `npm run build` also runs the sprite compression script (sharp). It is a no-op
#   for already-compressed assets, so build minutes stay low. `npm run ensure-sharp`
#   first installs the platform-specific sharp binary when the lockfile (generated on
#   macOS) does not provide it for Linux.
# - No database is required: saves live in the browser (localStorage).
#   Supabase is only needed for the multiplayer/coop feature.
# - NODE_OPTIONS caps the V8 heap below the instance memory to avoid OOM kills
#   during `next build` on small instances.

services:
  - type: web
    name: isometric-city
    runtime: node
    plan: starter # use "free" to try it out (the service sleeps after ~15 min idle)
    region: frankfurt
    branch: main
    # NODE_ENV=production is already set on the service, which makes `npm ci` skip
    # devDependencies (autoprefixer, tailwindcss, typescript) and breaks the build.
    # Force a full install for the build step.
    buildCommand: NODE_ENV=development npm ci --include=dev && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.21.1
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=2048
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false # set in the dashboard (optional, multiplayer only)
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false # set in the dashboard (optional, multiplayer only)
